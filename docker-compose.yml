services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalflow
      POSTGRES_USER: signalflow
      POSTGRES_PASSWORD: signalflow
    volumes:
      - signalflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      target: production
    env_file: .env
    environment:
      SIGNALFLOW_DATABASE_URL: postgresql+psycopg://signalflow:signalflow@db:5432/signalflow
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  # Quality checks and unit tests (dev extras only — not used for runtime).
  # Usage: docker compose run --rm backend-test ruff check .
  backend-test:
    build:
      context: ./backend
      target: development
    working_dir: /app
    environment:
      SIGNALFLOW_DATABASE_URL: postgresql+psycopg://signalflow:signalflow@db:5432/signalflow
      SIGNALFLOW_MOCK_EXTERNAL_SERVICES: "true"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_BUSINESS_ID: ${VITE_BUSINESS_ID:-}
      VITE_OWNER_API_TOKEN: ${VITE_OWNER_API_TOKEN:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  signalflow_postgres:
