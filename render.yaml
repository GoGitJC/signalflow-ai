# Render Blueprint — Verideum production backend + managed Postgres.
# Docs: docs/deployment/render.md
#
# Set secret values in the Render dashboard (sync: false).
# Do NOT put real secrets in this file.
#
# IMPORTANT: Never set DATABASE_URL / SIGNALFLOW_DATABASE_URL to a Docker
# Compose hostname (`@db:`). Always use fromDatabase connectionString.

databases:
  - name: verideum-db
    plan: basic-256mb
    databaseName: verideum
    user: verideum
    postgresMajorVersion: "16"

services:
  - type: web
    name: verideum-ai
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: SIGNALFLOW_ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      # Render Postgres internal URL (also accepted as DATABASE_URL by the app).
      - key: SIGNALFLOW_DATABASE_URL
        fromDatabase:
          name: verideum-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: verideum-db
          property: connectionString
      # Temporary public URL until api.verideum.com DNS is connected.
      - key: APP_PUBLIC_API_URL
        value: https://verideum-ai.onrender.com
      - key: CORS_ORIGINS
        value: https://verideum-app.vercel.app,https://verideum.com,https://www.verideum.com,https://app.verideum.com
      - key: SIGNALFLOW_FRONTEND_ORIGIN
        value: https://verideum-app.vercel.app
      - key: TRUSTED_HOSTS
        value: verideum-ai.onrender.com,api.verideum.com,verideum.com,www.verideum.com,app.verideum.com,*.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ALLOW_LIVE_BOOKING
        value: "false"
      - key: INTEGRATION_MODE
        value: live
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNALFLOW_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: OWNER_API_TOKEN
        sync: false
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: RETELL_AGENT_NAME
        sync: false
      # Do not switch Retell dashboard URLs until this backend is healthy.
      - key: RETELL_WEBHOOK_BASE_URL
        value: https://verideum-ai.onrender.com
      - key: SIGNALFLOW_RETELL_WEBHOOK_SECRET
        sync: false
      - key: CALCOM_API_KEY
        sync: false
      - key: CALCOM_EVENT_TYPE_ID
        sync: false
      - key: CALCOM_EVENT_TYPE_SLUG
        sync: false
      - key: CALCOM_USERNAME
        sync: false
      - key: SIGNALFLOW_CALCOM_WEBHOOK_SECRET
        sync: false
      - key: SIGNALFLOW_TWILIO_ACCOUNT_SID
        sync: false
      - key: SIGNALFLOW_TWILIO_AUTH_TOKEN
        sync: false
      - key: PORT
        value: "8000"
