# Render Blueprint — SignalFlow AI production backend + managed Postgres.
# Docs: docs/deployment/render.md
#
# Replace <DOMAIN> before applying, or set values in the Render dashboard.
# Do NOT put real secrets in this file — use Render secret env vars / sync.

databases:
  - name: signalflow-db
    plan: basic-256mb
    databaseName: signalflow
    user: signalflow
    postgresMajorVersion: "16"

services:
  - type: web
    name: signalflow-api
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: SIGNALFLOW_ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: SIGNALFLOW_DATABASE_URL
        fromDatabase:
          name: signalflow-db
          property: connectionString
      - key: APP_PUBLIC_API_URL
        sync: false
        # Set to https://api.<DOMAIN>
      - key: CORS_ORIGINS
        sync: false
        # Set to https://www.<DOMAIN>,https://app.<DOMAIN>
      - key: SIGNALFLOW_FRONTEND_ORIGIN
        sync: false
        # Primary dashboard origin, e.g. https://www.<DOMAIN>
      - key: TRUSTED_HOSTS
        sync: false
        # e.g. api.<DOMAIN>,*.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ALLOW_LIVE_BOOKING
        value: "false"
      - key: INTEGRATION_MODE
        value: live
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNALFLOW_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: OWNER_API_TOKEN
        sync: false
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: RETELL_AGENT_NAME
        sync: false
      - key: RETELL_WEBHOOK_BASE_URL
        sync: false
      - key: SIGNALFLOW_RETELL_WEBHOOK_SECRET
        sync: false
      - key: CALCOM_API_KEY
        sync: false
      - key: CALCOM_EVENT_TYPE_ID
        sync: false
      - key: CALCOM_EVENT_TYPE_SLUG
        sync: false
      - key: CALCOM_USERNAME
        sync: false
      - key: SIGNALFLOW_CALCOM_WEBHOOK_SECRET
        sync: false
      - key: SIGNALFLOW_TWILIO_ACCOUNT_SID
        sync: false
      - key: SIGNALFLOW_TWILIO_AUTH_TOKEN
        sync: false
      - key: PORT
        value: "8000"
