name: Bug report
description: Report a defect in Verideum
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Do **not** include secrets, `.env` values, or customer PII.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, commands, or API calls
      placeholder: |
        1. docker compose up --build
        2. curl ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Webhooks
        - Database / migrations
        - Frontend dashboard
        - Docker / Compose
        - CI
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Branch / commit
      placeholder: main or abc1234
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste sanitized logs only
