[project]
name = "signalflow-backend"
version = "0.1.0"
description = "SignalFlow AI multi-tenant receptionist backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "cryptography>=44,<46",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-setuptools>=75",
  # Starlette TestClient prefers httpx2; without it pytest emits StarletteDeprecationWarning.
  "httpx2>=2.0,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["(?x)(^tests/|^alembic/|^\\.venv/)"]
